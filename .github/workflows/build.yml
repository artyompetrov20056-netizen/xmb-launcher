name: Сборка APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: xmb-launcher-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
